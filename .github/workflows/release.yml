name: Release & Deploy

on:
  workflow_dispatch:
    inputs:
      version:
        description: 'Release version (e.g. 1.0.1)'
        required: true
        default: '1.0.1'

permissions:
  contents: write

jobs:
  deploy-vercel:
    name: Deploy to Vercel (Web)
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: 'npm'

      - name: Install dependencies
        run: npm ci

      - name: Deploy to Vercel Production
        env:
          VERCEL_TOKEN: ${{ secrets.VERCEL_TOKEN }}
          VERCEL_ORG_ID: team_5tpggNPZ9g6atDokAW1p6Gog
          VERCEL_PROJECT_ID: prj_OPOfg4kEEGENTSiNpxt2vjzmxc1S
        run: |
          if [ -n "$VERCEL_TOKEN" ]; then
            echo "Deploying to Vercel production..."
            npx vercel deploy --prod --yes --token="$VERCEL_TOKEN"
          else
            echo "Notice: VERCEL_TOKEN secret not configured in GitHub repository. Skipping Vercel deploy."
          fi

  build-mac:
    name: Build macOS Packages
    runs-on: macos-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: 'npm'

      - name: Install dependencies
        run: npm ci

      - name: Build Web & Electron
        run: npm run build

      - name: Package macOS (.dmg, .zip)
        run: npx electron-builder --mac --publish never
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: Upload macOS Artifacts
        uses: actions/upload-artifact@v4
        with:
          name: mac-packages
          path: |
            release/*.dmg
            release/*.zip
          if-no-files-found: error

  build-windows:
    name: Build Windows Packages
    runs-on: windows-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: 'npm'

      - name: Install dependencies
        run: npm ci

      - name: Build Web & Electron
        run: npm run build

      - name: Package Windows (.exe, .zip)
        run: npx electron-builder --win --publish never
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: Upload Windows Artifacts
        uses: actions/upload-artifact@v4
        with:
          name: windows-packages
          path: |
            release/*.exe
            release/*.zip
          if-no-files-found: error

  publish-release:
    name: Publish GitHub Release
    needs: [build-mac, build-windows]
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Download all packaged artifacts
        uses: actions/download-artifact@v4
        with:
          path: release-artifacts
          merge-multiple: true

      - name: Create GitHub Release with Downloads
        uses: softprops/action-gh-release@v2
        with:
          tag_name: v${{ github.event.inputs.version }}
          name: ProCase v${{ github.event.inputs.version }}
          body: |
            ## 📥 Quick Downloads for ProCase v${{ github.event.inputs.version }}

            Choose your operating system below to download the app:

            | Platform | Download Link | Notes |
            | :--- | :--- | :--- |
            | 🍏 **Mac (Apple Silicon)** | [⬇️ **Download for Mac (Apple Silicon)**](https://github.com/ce2727/CasingAutomation/releases/download/v${{ github.event.inputs.version }}/ProCase-${{ github.event.inputs.version }}-arm64.dmg) | *Recommended for M1, M2, M3, M4 Macs (2020+)* |
            | 🍏 **Mac (Intel)** | [⬇️ **Download for Mac (Intel)**](https://github.com/ce2727/CasingAutomation/releases/download/v${{ github.event.inputs.version }}/ProCase-${{ github.event.inputs.version }}.dmg) | *For older Macs (2019 or earlier)* |
            | 🪟 **Windows PC** | [⬇️ **Download for Windows (.exe)**](https://github.com/ce2727/CasingAutomation/releases/download/v${{ github.event.inputs.version }}/ProCase%20Setup%20${{ github.event.inputs.version }}.exe) | *Setup installer for Windows 10 & 11* |
            | 🌐 **Web Browser** | [🔗 **Launch Web Version**](https://casingautomation.vercel.app) | *Runs instantly in your browser (no install needed)* |

            ---

            ### 🚀 Quick Start Instructions

            #### 🍏 For Mac Users:
            1. Click **Download for Mac (Apple Silicon)** above.
            2. Open the downloaded `.dmg` and drag **ProCase** into your **Applications** folder.
            3. *First time opening:* If macOS blocks it with an unverified developer message:
               - Open **System Settings** ( Apple menu) → **Privacy & Security**.
               - Scroll down and click **Open Anyway**. (You only need to do this once!).

            #### 🪟 For Windows Users:
            1. Click **Download for Windows (.exe)** above.
            2. Open the downloaded file to install and start ProCase.
            3. *First time opening:* If Windows SmartScreen displays *"Windows protected your PC"*:
               - Click **More info** → **Run anyway**.

            ---
            *All individual build files and portable .zip archives are listed below under **Assets**.*
          files: |
            release-artifacts/*.dmg
            release-artifacts/*.exe
            release-artifacts/*.zip
          draft: false
          prerelease: false
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
