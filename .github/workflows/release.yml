name: Release & Deploy

on:
  workflow_dispatch:
    inputs:
      version:
        description: 'Release version (e.g. 1.0.1)'
        required: true
        default: '1.0.1'

permissions:
  contents: write

jobs:
  deploy-vercel:
    name: Deploy to Vercel (Web)
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: 'npm'

      - name: Install dependencies
        run: npm ci

      - name: Deploy to Vercel Production
        env:
          VERCEL_TOKEN: ${{ secrets.VERCEL_TOKEN }}
          VERCEL_ORG_ID: team_5tpggNPZ9g6atDokAW1p6Gog
          VERCEL_PROJECT_ID: prj_OPOfg4kEEGENTSiNpxt2vjzmxc1S
        run: |
          if [ -n "$VERCEL_TOKEN" ]; then
            echo "Deploying to Vercel production..."
            npx vercel deploy --prod --yes --token="$VERCEL_TOKEN"
          else
            echo "Notice: VERCEL_TOKEN secret not configured in GitHub repository. Skipping Vercel deploy."
          fi

  build-mac:
    name: Build macOS Packages
    runs-on: macos-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: 'npm'

      - name: Install dependencies
        run: npm ci

      - name: Sync Version
        run: npm version ${{ github.event.inputs.version }} --no-git-tag-version --allow-same-version

      - name: Build Web & Electron
        run: npm run build

      - name: Package macOS (.dmg, .zip)
        run: npx electron-builder --mac --publish never
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: Upload macOS Artifacts
        uses: actions/upload-artifact@v4
        with:
          name: mac-packages
          path: |
            release/*.dmg
            release/*.zip
          if-no-files-found: error

  build-windows:
    name: Build Windows Packages
    runs-on: windows-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: 'npm'

      - name: Install dependencies
        run: npm ci

      - name: Sync Version
        run: npm version ${{ github.event.inputs.version }} --no-git-tag-version --allow-same-version

      - name: Build Web & Electron
        run: npm run build

      - name: Package Windows (.exe, .zip)
        run: npx electron-builder --win --publish never
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: Upload Windows Artifacts
        uses: actions/upload-artifact@v4
        with:
          name: windows-packages
          path: |
            release/*.exe
            release/*.zip
          if-no-files-found: error

  publish-release:
    name: Publish GitHub Release
    needs: [build-mac, build-windows]
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Download all packaged artifacts
        uses: actions/download-artifact@v4
        with:
          path: release-artifacts
          merge-multiple: true

      - name: Create GitHub Release with Downloads
        uses: softprops/action-gh-release@v2
        with:
          tag_name: v${{ github.event.inputs.version }}
          name: ProCase v${{ github.event.inputs.version }}
          body: |
            ## 🚀 ProCase v${{ github.event.inputs.version }}

            ---

            ### 🍏 Mac Downloads & Setup

            #### 1. Download for your Mac:
            - [🍏 **Download for Mac (Apple Silicon)**](https://github.com/ce2727/CasingAutomation/releases/download/v${{ github.event.inputs.version }}/ProCase-${{ github.event.inputs.version }}-arm64.dmg)  
              *Recommended for M1, M2, M3, M4 Macs (2020 or newer)*
            - [🍏 **Download for Mac (Intel)**](https://github.com/ce2727/CasingAutomation/releases/download/v${{ github.event.inputs.version }}/ProCase-${{ github.event.inputs.version }}.dmg)  
              *For older Macs (2019 or earlier)*

            #### 2. Install & Security Instructions:
            Because ProCase is a free, student-developed open-source application and not distributed through the Apple Mac App Store, macOS Gatekeeper will show a security message on the first launch stating that *Apple could not verify ProCase* or that it is from an *unidentified developer*. This is standard Apple security behavior for non-App Store software.

            1. Double-click the downloaded `.dmg` file and drag the **ProCase** icon into your **Applications** folder.
            2. Open your **Applications** folder and double-click **ProCase**.
            3. If macOS blocks it with the alert *"Apple could not verify 'ProCase' is free of malware"*:
               - Click **Done** on the popup (do not move to trash).
               - Open **System Settings** ( Apple menu at top left) → **Privacy & Security**.
               - Scroll down toward the bottom of the page until you see:  
                 *"ProCase" was blocked from use because it is not from an identified developer.*
               - Click **Open Anyway**.
               - When prompted, enter your Mac password or Touch ID, then click **Open** on the confirmation prompt.

            *(Alternative shortcut: In your Applications folder, hold the **Control** key and click **ProCase**, then select **Open** from the menu and click **Open**).*

            > 💡 **Note:** You only have to do this once! Afterwards, ProCase will open normally with a standard double-click.

            ---

            ### 🪟 Windows Download & Setup

            #### 1. Download for Windows:
            - [🪟 **Download ProCase for Windows (.exe)**](https://github.com/ce2727/CasingAutomation/releases/download/v${{ github.event.inputs.version }}/ProCase%20Setup%20${{ github.event.inputs.version }}.exe)  
              *Setup installer for Windows 10 & 11*

            #### 2. Install & Security Instructions:
            Because ProCase is a free open-source application and does not use an expensive corporate code-signing certificate, Windows Defender SmartScreen may display an alert on first launch stating *"Windows protected your PC"*.

            1. Double-click the downloaded `ProCase Setup.exe` file.
            2. If a blue **Windows protected your PC** (SmartScreen) popup appears:
               - Click the small blue text link that says **More info**.
               - A new button will appear: click **Run anyway**.
            3. ProCase will finish installing and automatically launch!

            ---

            ### 🌐 Web Version (Casee Only)

            - [🌐 **Launch Web Version**](https://casingautomation.vercel.app)

            **⚠️ Important Note on the Web Version:**  
            The browser version is **not** the full application:
            - **What it does:** Allows you to quickly join someone else's case session as a **Casee / Interviewee** in your browser without installing software.
            - **What it cannot do:** You cannot give cases, access or manage a case library, build cases, or track casing history.
            - **To give cases or manage your library:** You **must** download and install the desktop app for **Mac** or **Windows** above.

            ---
            *All individual build files and portable .zip archives are listed below under **Assets**.*
          files: |
            release-artifacts/*.dmg
            release-artifacts/*.exe
            release-artifacts/*.zip
          draft: false
          prerelease: false
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
